<!DOCTYPE html>
<html>
<head>
    <title>OTP Verification</title>
</head>

<body>

<h2>OTP Verification</h2>

{% if otp %}
<p>Your OTP is: <strong>{{ otp }}</strong></p>
{% endif %}

{% if error %}
<p>{{ error }}</p>
{% endif %}

<form method="POST">

    {% csrf_token %}

    <input
        type="text"
        name="otp"
        maxlength="6"
        placeholder="Enter OTP"
        required
    >

    <br><br>

    <button type="submit">
        Verify OTP
    </button>

</form>

</body>
</html>
