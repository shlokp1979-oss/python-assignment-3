<!DOCTYPE html>
<html>
<head>
    <title>Verify OTP</title>
</head>
<body>

<h1>Verify OTP</h1>

{% if error %}
    <p>{{ error }}</p>
{% endif %}

<form method="POST">
    {% csrf_token %}

    <input
        type="text"
        name="code"
        placeholder="Enter 6 digit OTP"
        maxlength="6"
        required
    >

    <br><br>

    <button type="submit">Verify OTP</button>
</form>

</body>
</html>
