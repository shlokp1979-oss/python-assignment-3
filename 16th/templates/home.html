<!DOCTYPE html>
<html>
<head>
    <title>Integration App</title>
</head>

<body>

<h1>My Django Integration App</h1>

{% if user.is_authenticated %}

    <h2>Welcome {{ user.username }}</h2>
    <p>Email: {{ user.email }}</p>

    <br>

    <a href="{% url 'send_email' %}">
        Send Welcome Email
    </a>

    <br><br>

    <a href="{% url 'send_otp' %}">
        Send OTP
    </a>

    <br><br>

    <a href="{% url 'verify_otp' %}">
        Verify OTP
    </a>

{% else %}

    <a href="{% url 'login' %}">
        Login with Google
    </a>

{% endif %}

</body>
</html>
