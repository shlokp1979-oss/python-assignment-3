<!DOCTYPE html>
<html>

<head>

    <title>Products</title>

    <style>

        body {
            font-family: Arial;
            margin: 40px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: left;
        }

        th {
            background-color: #eeeeee;
        }

        a {
            margin-right: 10px;
        }

    </style>

</head>

<body>

    <h1>Flipkart Products</h1>

    <a href="{% url 'add_product' %}">
        <button>Add Product</button>
    </a>

    <br><br>

    <table>

        <tr>
            <th>Name</th>
            <th>Price</th>
            <th>Category</th>
            <th>Actions</th>
        </tr>

        {% for product in products %}

        <tr>

            <td>
                {{ product.name }}
            </td>

            <td>
                ₹{{ product.price }}
            </td>

            <td>
                {{ product.category }}
            </td>

            <td>

                <a href="{% url 'edit_product' product.id %}">
                    Edit
                </a>

                <a href="{% url 'delete_product' product.id %}">
                    Delete
                </a>

            </td>

        </tr>

        {% empty %}

        <tr>
            <td colspan="4">
                No products available.
            </td>
        </tr>

        {% endfor %}

    </table>

</body>

</html>
