<!DOCTYPE html>
<html>

<head>
    <title>My Orders</title>
</head>

<body>

<h1>My Orders</h1>

{% for order in orders %}

<p>
    {{ order.product }} -
    ₹{{ order.price }}
</p>

{% empty %}

<p>No orders found.</p>

{% endfor %}

<a href="{% url 'dashboard' %}">
    Dashboard
</a>

</body>

</html>
