<!DOCTYPE html>
<html>

<head>
    <title>Edit Profile</title>
</head>

<body>

    <h2>Edit Instagram Profile</h2>

    <form method="POST" enctype="multipart/form-data">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Save Profile
        </button>

    </form>

    <br>

    <a href="{% url 'profile' %}">
        View Profile
    </a>

</body>

</html>
