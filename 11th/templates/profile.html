<!DOCTYPE html>
<html>

<head>
    <title>My Profile</title>
</head>

<body>

    <h1>My Profile</h1>

    {% if profile.profile_pic %}

        <img
            src="{{ profile.profile_pic.url }}"
            width="200"
            height="200"
            style="object-fit: cover;"
        >

    {% else %}

        <img
            src="https://via.placeholder.com/200"
            width="200"
            height="200"
        >

    {% endif %}

    <h2>
        {{ profile.display_name }}
    </h2>

    <p>
        {{ profile.bio }}
    </p>

    <p>
        Phone: {{ profile.phone_number }}
    </p>

    <a href="{% url 'edit_profile' %}">
        Edit Profile
    </a>

</body>

</html>
