<!DOCTYPE html>
<html>

<head>
    <title>Verify OTP</title>
</head>

<body>

    <h2>Verify OTP</h2>

    {% if error %}
        <p style="color: red;">
            {{ error }}
        </p>
    {% endif %}

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Verify OTP
        </button>

    </form>

</body>

</html>
