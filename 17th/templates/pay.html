<!DOCTYPE html>
<html>
<head>
    <title>IPL Ticket Payment</title>
</head>

<body>

<h1>IPL Match Ticket Payment</h1>

<form method="POST">

    <label>Name:</label>
    <input type="text" name="name" required>

    <br><br>

    <label>Email:</label>
    <input type="email" name="email" required>

    <br><br>

    <label>Amount:</label>
    <input type="number" name="amount" required>

    <br><br>

    <button type="submit">Pay Now</button>

</form>

</body>
</html>
