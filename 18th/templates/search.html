<!DOCTYPE html>
<html>
<head>
    <title>Nearby Pickup Points</title>
</head>

<body>

<h1>Find Nearest Pickup Points</h1>

<form method="POST">

    {% csrf_token %}

    <label>Your Latitude:</label>
    <input type="text" name="latitude" required>

    <br><br>

    <label>Your Longitude:</label>
    <input type="text" name="longitude" required>

    <br><br>

    <button type="submit">
        Search
    </button>

</form>

<hr>

{% if results %}

<h2>Nearest Pickup Points</h2>

{% for point in results %}

<p>
    <strong>{{ point.name }}</strong>
    <br>
    {{ point.address }}
    <br>
    Distance: {{ point.distance }} km
</p>

<hr>

{% endfor %}

{% endif %}

</body>
</html>
